#ui .sub{font-size:10px;color:#6a7a8a;margin-bottom:10px;font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.mode-row{display:flex;gap:4px;margin-bottom:10px}
.mode-btn{
  flex:1;padding:7px 4px;font-size:11px;font-weight:600;background:rgba(255,255,255,.04);
  color:#8a9aaa;border:1px solid rgba(255,255,255,.08);border-radius:4px;cursor:pointer;font-family:system-ui,sans-serif
}
.mode-btn.active{background:rgba(232,197,71,.12);color:#e8c547;border-color:rgba(232,197,71,.35)}
.mode-btn:hover{border-color:rgba(255,255,255,.15)}
label{display:block;font-size:10px;color:#7a8a9a;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
select{
  width:100%;padding:8px 10px;font-size:13px;background:#12151a;color:#e0e0e0;
  border:1px solid rgba(255,255,255,.1);border-radius:4px;cursor:pointer;outline:none;font-family:system-ui,sans-serif
}
select:hover,select:focus{border-color:rgba(232,197,71,.4)}
button.fire{
  margin-top:12px;width:100%;padding:11px;font-family:'BobloxClassic',sans-serif;font-size:15px;
  background:linear-gradient(180deg,#a83228,#6e1a14);border:1px solid #c44;border-radius:4px;
  color:#fff;cursor:pointer;letter-spacing:1px
}
button.fire:hover{background:linear-gradient(180deg,#c04035,#8a2218)}
button.fire:disabled{opacity:.45;cursor:not-allowed}
.stats{
  margin-top:10px;padding:9px;background:rgba(0,0,0,.35);border-radius:4px;
  font-size:11px;line-height:1.5;border:1px solid rgba(255,255,255,.06);color:#a0aab4
}
.stats strong{color:#e8c547}
.result{
  margin-top:8px;padding:7px;border-radius:4px;font-weight:600;text-align:center;min-height:30px;
  display:flex;align-items:center;justify-content:center;font-size:12px
}
.result.pen{background:rgba(34,120,60,.25);color:#5dca7a;border:1px solid rgba(34,120,60,.4)}
.result.nope{background:rgba(140,40,40,.25);color:#e07070;border:1px solid rgba(140,40,40,.4)}
.result.idle{background:rgba(255,255,255,.03);color:#6a7a8a;border:1px solid rgba(255,255,255,.06)}
.sandbox-hint{
  margin-top:8px;padding:7px;background:rgba(40,60,90,.25);border-radius:4px;
  font-size:10px;color:#8ab4d4;border:1px solid rgba(80,120,160,.25);display:none
}
.sandbox-hint.show{display:block}
#country-badge{
  position:fixed;top:12px;right:12px;z-index:10;background:rgba(14,16,20,.9);
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:7px 12px;font-size:12px;
  color:#e8c547;display:flex;align-items:center;gap:8px;font-weight:600
}
#country-badge img{width:28px;height:19px;object-fit:cover;border:1px solid #333;border-radius:2px}
#help{
  position:fixed;bottom:12px;right:12px;z-index:10;background:rgba(14,16,20,.88);
  border:1px solid rgba(255,255,255,.06);border-radius:4px;padding:6px 10px;
  font-size:10px;color:#6a7a8a;max-width:240px;line-height:1.4
}
#loader{
  position:fixed;inset:0;z-index:100;background:#0a0b0d;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:'BobloxClassic',sans-serif;
  font-size:18px;color:#e8c547;transition:opacity .6s;gap:6px
}
#loader .sub-load{font-size:11px;color:#6a7a8a;font-family:system-ui,sans-serif}
#loader.hidden{opacity:0;pointer-events:none}
</style>
</head>

addWall(W,H,0,H/2,-D/2,0,wallDark);addWall(W,2.2,0,1.1,D/2,Math.PI);addWall(D,H,-W/2,H/2,0,Math.PI/2);addWall(D,H,W/2,H/2,0,-Math.PI/2);

function setFlag(code){
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{flagCtx.fillStyle='#111';flagCtx.fillRect(0,0,640,384);flagCtx.drawImage(img,0,0,640,384);flagTex.needsUpdate=true};

  document.getElementById('flag-icon').src='https://flagcdn.com/w80/'+code+'.png';
}

let tankGroup=null,turretGroup=null;
function mat(c,r=0.58,m=0.38){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
function box(p,geo,material,x,y,z,rx=0,ry=0,rz=0){const mesh=new THREE.Mesh(geo,material);mesh.position.set(x,y,z);mesh.rotation.set(rx,ry,rz);mesh.castShadow=true;mesh.receiveShadow=true;p.add(mesh);return mesh}
function tracks(p,L,Hgt,Wd,side,dark,track){
  box(p,new THREE.BoxGeometry(L*0.94,Hgt*0.18,Wd*0.17),track,0,Hgt*0.1,side*(Wd*0.4));
  const r=Hgt*0.095;
  for(let i=0;i<7;i++){const w=new THREE.Mesh(new THREE.CylinderGeometry(r,r,Wd*0.14,14),dark);w.rotation.x=Math.PI/2;w.position.set(-L*0.35+i*(L*0.11),Hgt*0.095,side*(Wd*0.4));w.castShadow=true;p.add(w)}
  [-L*0.4,L*0.4].forEach(wx=>{const s=new THREE.Mesh(new THREE.CylinderGeometry(r*1.1,r*1.1,Wd*0.12,12),dark);s.rotation.x=Math.PI/2;s.position.set(wx,Hgt*0.11,side*(Wd*0.4));p.add(s)});
  box(p,new THREE.BoxGeometry(L*0.85,Hgt*0.24,0.04),track,0,Hgt*0.24,side*(Wd*0.49));
}
function gun(p,Hgt,dark,len=5.3){
  box(p,new THREE.BoxGeometry(0.5,0.48,0.6),dark,1.0,Hgt*0.78,0);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.095,0.115,len,14),dark);barrel.rotation.z=Math.PI/2;barrel.position.set(1+len/2,Hgt*0.78,0);barrel.castShadow=true;p.add(barrel);
  for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.2,12),dark);ring.rotation.z=Math.PI/2;ring.position.set(1.9+i*0.95,Hgt*0.78,0);p.add(ring)}
  const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.11,0.28,12),dark);muzzle.rotation.z=Math.PI/2;muzzle.position.set(1+len+0.06,Hgt*0.78,0);p.add(muzzle);
  const fume=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.48,12),dark);fume.rotation.z=Math.PI/2;fume.position.set(1+len*0.5,Hgt*0.78,0);p.add(fume);
}
function buildWheeled(p,L,Hgt,Wd,dark){
  const wheelR=0.52;[-L*0.3,-L*0.1,L*0.1,L*0.28].forEach(wx=>{for(const side of[-1,1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(wheelR,wheelR,0.32,16),dark);w.rotation.x=Math.PI/2;w.position.set(wx,wheelR,side*(Wd*0.47));w.castShadow=true;p.add(w)}});
}

function buildVehicle(v){
  if(tankGroup){scene.remove(tankGroup);tankGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}})}
  tankGroup=new THREE.Group();turretGroup=new THREE.Group();
  const body=mat(v.color,0.62,0.32),accent=mat(v.accent,0.65,0.28),dark=mat(0x141414,0.45,0.6),track=mat(0x1a1a18,0.88,0.15);
  const isTracked=!['stryker','btr','boxer'].includes(v.style);
  const isIFV=v.type==='IFV'||v.type==='APC';
  const L=isIFV?7:9.5,Wd=isIFV?2.95:3.5,Hgt=isIFV?1.95:2.25;
  box(tankGroup,new THREE.BoxGeometry(L*0.9,Hgt*0.34,Wd*0.87),body,0,Hgt*0.25,0);
  if(v.style==='abrams'||v.style==='challenger'||v.style==='k2'){box(tankGroup,new THREE.BoxGeometry(L*0.5,Hgt*0.28,Wd*0.84),body,-0.45,Hgt*0.48,0);box(tankGroup,new THREE.BoxGeometry(L*0.28,Hgt*0.24,Wd*0.81),body,L*0.25,Hgt*0.38,0,0,0,-0.38)}
  else if(v.style==='leopard'||v.style==='leclerc'||v.style==='ariete'){box(tankGroup,new THREE.BoxGeometry(L*0.46,Hgt*0.26,Wd*0.84),body,-0.4,Hgt*0.46,0);box(tankGroup,new THREE.BoxGeometry(L*0.3,Hgt*0.22,Wd*0.81),body,L*0.23,Hgt*0.36,0,0,0,-0.34)}
  else if(v.style==='merkava'){box(tankGroup,new THREE.BoxGeometry(L*0.44,Hgt*0.3,Wd*0.84),body,-0.2,Hgt*0.48,0);box(tankGroup,new THREE.BoxGeometry(L*0.33,Hgt*0.26,Wd*0.81),body,L*0.26,Hgt*0.4,0,0,0,-0.24);box(tankGroup,new THREE.BoxGeometry(L*0.18,Hgt*0.14,Wd*0.66),accent,L*0.34,Hgt*0.52,0)}
  else if(v.style==='t14'){box(tankGroup,new THREE.BoxGeometry(L*0.52,Hgt*0.26,Wd*0.85),body,-0.25,Hgt*0.46,0);box(tankGroup,new THREE.BoxGeometry(L*0.33,Hgt*0.2,Wd*0.83),body,L*0.26,Hgt*0.34,0,0,0,-0.46);box(tankGroup,new THREE.CylinderGeometry(1.05,1.15,0.22,16),body,0.15,Hgt*0.58,0)}
  else if(isIFV){box(tankGroup,new THREE.BoxGeometry(L*0.68,Hgt*0.38,Wd*0.88),body,-0.08,Hgt*0.42,0);box(tankGroup,new THREE.BoxGeometry(L*0.22,Hgt*0.26,Wd*0.84),body,L*0.33,Hgt*0.36,0,0,0,-0.18)}
  else{box(tankGroup,new THREE.BoxGeometry(L*0.48,Hgt*0.24,Wd*0.84),body,-0.3,Hgt*0.44,0);box(tankGroup,new THREE.BoxGeometry(L*0.3,Hgt*0.2,Wd*0.81),body,L*0.24,Hgt*0.34,0,0,0,-0.42)}
  if(isTracked){tracks(tankGroup,L,Hgt,Wd,-1,dark,track);tracks(tankGroup,L,Hgt,Wd,1,dark,track)}else buildWheeled(tankGroup,L,Hgt,Wd,dark);
  box(tankGroup,new THREE.BoxGeometry(L*0.15,Hgt*0.18,Wd*0.62),accent,-L*0.38,Hgt*0.42,0);
  if(v.style==='abrams'){box(turretGroup,new THREE.BoxGeometry(3.5,0.75,2.65),body,0.12,Hgt*0.74,0);box(turretGroup,new THREE.BoxGeometry(1.9,0.48,2.35),body,-1.15,Hgt*0.68,0);box(turretGroup,new THREE.BoxGeometry(0.85,0.35,2.25),body,1.4,Hgt*0.66,0);box(turretGroup,new THREE.BoxGeometry(0.4,0.28,0.45),dark,0.7,Hgt*0.98,0.6);gun(turretGroup,Hgt,dark,5.6)}
  else if(v.style==='leopard'){box(turretGroup,new THREE.BoxGeometry(3.3,0.65,2.45),body,0.08,Hgt*0.72,0);box(turretGroup,new THREE.BoxGeometry(1.6,0.42,2.15),body,-1.2,Hgt*0.66,0);box(turretGroup,new THREE.BoxGeometry(1.05,0.48,2.25),body,1.25,Hgt*0.68,0,0,0,-0.12);gun(turretGroup,Hgt,dark,5.3)}
  else if(v.style==='t90'||v.style==='t84'){const core=new THREE.Mesh(new THREE.SphereGeometry(1.4,16,12,0,Math.PI*2,0,Math.PI*0.55),body);core.position.set(0.08,Hgt*0.5,0);core.scale.set(1.1,0.66,0.96);core.castShadow=true;turretGroup.add(core);box(turretGroup,new THREE.BoxGeometry(1.4,0.38,1.95),body,-1.1,Hgt*0.68,0);for(let i=-2;i<=2;i++)box(turretGroup,new THREE.BoxGeometry(0.3,0.2,0.42),accent,0.8,Hgt*0.9,i*0.4);gun(turretGroup,Hgt,dark,5)}
  else if(v.style==='t14'){box(turretGroup,new THREE.BoxGeometry(2.7,0.5,2.1),body,0.12,Hgt*0.76,0);box(turretGroup,new THREE.BoxGeometry(1.1,0.32,1.7),body,-0.95,Hgt*0.7,0);gun(turretGroup,Hgt,dark,5.4)}
  else if(v.style==='challenger'){box(turretGroup,new THREE.BoxGeometry(3.9,0.7,2.55),body,0,Hgt*0.74,0);box(turretGroup,new THREE.BoxGeometry(1.8,0.42,2.25),body,-1.4,Hgt*0.66,0);gun(turretGroup,Hgt,dark,5.4)}
  else if(v.style==='merkava'){box(turretGroup,new THREE.BoxGeometry(3.1,0.8,2.55),body,-0.12,Hgt*0.76,0);box(turretGroup,new THREE.BoxGeometry(1.3,0.5,2.25),body,-1.4,Hgt*0.7,0);box(turretGroup,new THREE.BoxGeometry(0.1,0.6,2.35),accent,1.35,Hgt*0.7,0);gun(turretGroup,Hgt,dark,4.8)}
  else if(v.style==='type99'||v.style==='k2'){box(turretGroup,new THREE.BoxGeometry(3.2,0.6,2.35),body,0.08,Hgt*0.7,0);box(turretGroup,new THREE.BoxGeometry(1.45,0.38,2.05),body,-1.15,Hgt*0.66,0);box(turretGroup,new THREE.BoxGeometry(0.95,0.42,2.15),body,1.15,Hgt*0.68,0,0,0,-0.09);gun(turretGroup,Hgt,dark,5.2)}
  else if(v.style==='bradley'||v.style==='puma'||v.style==='warrior'||v.style==='cv90'){box(turretGroup,new THREE.BoxGeometry(2.1,0.5,1.8),body,0.25,Hgt*0.7,0);box(turretGroup,new THREE.BoxGeometry(0.85,0.32,1.4),body,-0.65,Hgt*0.66,0);const ac=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.065,2.6,10),dark);ac.rotation.z=Math.PI/2;ac.position.set(1.9,Hgt*0.76,0);turretGroup.add(ac)}
  else if(v.style==='bmp'){box(turretGroup,new THREE.BoxGeometry(1.7,0.45,1.6),body,0.35,Hgt*0.68,0);const ac=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,2.3,10),dark);ac.rotation.z=Math.PI/2;ac.position.set(1.8,Hgt*0.72,0);turretGroup.add(ac)}
  else if(v.style==='stryker'||v.style==='boxer'){box(turretGroup,new THREE.BoxGeometry(1.9,0.45,1.7),body,0.15,Hgt*0.68,0);const ac=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.075,3,10),dark);ac.rotation.z=Math.PI/2;ac.position.set(2,Hgt*0.72,0);turretGroup.add(ac)}
  else if(v.style==='btr'){box(turretGroup,new THREE.BoxGeometry(1.4,0.38,1.3),body,0.25,Hgt*0.66,0);const ac=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.055,2,10),dark);ac.rotation.z=Math.PI/2;ac.position.set(1.6,Hgt*0.7,0);turretGroup.add(ac)}
  else{box(turretGroup,new THREE.BoxGeometry(3,0.64,2.3),body,0.1,Hgt*0.72,0);box(turretGroup,new THREE.BoxGeometry(1.3,0.38,1.95),body,-1.05,Hgt*0.66,0);gun(turretGroup,Hgt,dark,5.1)}
  if(!isIFV)box(turretGroup,new THREE.CylinderGeometry(0.3,0.34,0.24,12),body,0.3,Hgt*1.05,v.style==='merkava'?-0.3:0.38);
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,1.9,5),dark);ant.position.set(-0.65,Hgt*1.35,0.7);turretGroup.add(ant);
  tankGroup.add(turretGroup);scene.add(tankGroup);
  setFlag(v.flagCode);document.getElementById('country-name').textContent=v.country;
}

let projectileMesh=null,impactParticles=[],impactMarkers=[];
function createProjectileVisual(proj){
  if(projectileMesh){scene.remove(projectileMesh);projectileMesh.geometry?.dispose();projectileMesh.material?.dispose()}
  let geo,material;
  if(proj.id==='oyster'||proj.id==='rock'){geo=new THREE.DodecahedronGeometry(0.18,0);material=mat(0x7a7a6a,0.9,0.05)}
  else if(proj.id.includes('drone')){geo=new THREE.BoxGeometry(0.45,0.09,0.6);material=mat(0x222222,0.45,0.55)}
  else if(proj.type==='chemical'){geo=new THREE.ConeGeometry(0.08,0.55,10);material=mat(0xb83820,0.45,0.45)}
  else{geo=new THREE.CylinderGeometry(0.04,0.055,0.75,10);material=mat(0xc0c0a8,0.35,0.75)}
  projectileMesh=new THREE.Mesh(geo,material);projectileMesh.visible=false;scene.add(projectileMesh);
}
function spawnImpact(pos,success){
  const color=success?0x55dd77:0xff5533;
  const flash=new THREE.PointLight(success?0xaaffcc:0xffaa66,3.5,8,2);flash.position.copy(pos);scene.add(flash);
  setTimeout(()=>scene.remove(flash),80);
  for(let i=0;i<28;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.04+Math.random()*0.08,5,5),new THREE.MeshBasicMaterial({color:i<8?0xffcc66:color,transparent:true,opacity:1}));
    p.position.copy(pos);p.userData.vel=new THREE.Vector3((Math.random()-0.5)*0.55,Math.random()*0.6+0.15,(Math.random()-0.5)*0.55);p.userData.life=1;scene.add(p);impactParticles.push(p);
  }
  for(let i=0;i<12;i++){
    const s=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.15+Math.random()*0.2),new THREE.MeshBasicMaterial({color:0xffee88,transparent:true,opacity:1}));
    s.position.copy(pos);s.userData.vel=new THREE.Vector3((Math.random()-0.5)*0.9,Math.random()*0.7,(Math.random()-0.5)*0.9);s.userData.life=0.7;scene.add(s);impactParticles.push(s);
  }
  if(sandboxMode){const marker=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.7}));marker.position.copy(pos);scene.add(marker);impactMarkers.push(marker);if(impactMarkers.length>35){const o=impactMarkers.shift();scene.remove(o);o.geometry.dispose();o.material.dispose()}}
}

const tankSelect=document.getElementById('tank-select'),armorSelect=document.getElementById('armor-select'),projSelect=document.getElementById('proj-select');
const statsEl=document.getElementById('stats'),resultEl=document.getElementById('result'),fireBtn=document.getElementById('fire-btn'),sandboxHint=document.getElementById('sandbox-hint');
const groups={MBT:'Main battle tanks',IFV:'Infantry fighting vehicles',APC:'APCs / wheeled'};
Object.keys(groups).forEach(type=>{const og=document.createElement('optgroup');og.label=groups[type];VEHICLES.filter(v=>v.type===type).forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.name;if(v.id==='m1a2')o.selected=true;og.appendChild(o)});tankSelect.appendChild(og)});
ARMORS.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name;armorSelect.appendChild(o)});
PROJECTILES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;projSelect.appendChild(o)});
function getCurrent(){return{vehicle:VEHICLES.find(t=>t.id===tankSelect.value),armor:ARMORS.find(a=>a.id===armorSelect.value),proj:PROJECTILES.find(p=>p.id===projSelect.value)}}
function updateStats(){const{vehicle,armor,proj}=getCurrent();const effective=Math.round(vehicle.baseArmor*armor.multiplier);statsEl.innerHTML='<strong>'+vehicle.name+'</strong> · '+vehicle.type+' · '+vehicle.country+'<br>Protection: '+vehicle.baseArmor+' mm → <strong>'+effective+' mm</strong> RHA eq.<br>Round: '+proj.name+' · '+proj.penetration+' mm · '+proj.type+' · '+proj.velocity+' m/s<br><em style="color:#6a7a8a">'+proj.note+'</em>';resultEl.className='result idle';resultEl.textContent=sandboxMode?'Sandbox ready':'Ready';createProjectileVisual(proj)}
tankSelect.addEventListener('change',()=>{buildVehicle(VEHICLES.find(t=>t.id===tankSelect.value));updateStats()});
armorSelect.addEventListener('change',updateStats);projSelect.addEventListener('change',updateStats);
document.getElementById('mode-test').addEventListener('click',()=>{sandboxMode=false;document.getElementById('mode-test').classList.add('active');document.getElementById('mode-sandbox').classList.remove('active');sandboxHint.classList.remove('show');impactMarkers.forEach(m=>{scene.remove(m);m.geometry.dispose();m.material.dispose()});impactMarkers=[];updateStats()});
document.getElementById('mode-sandbox').addEventListener('click',()=>{sandboxMode=true;document.getElementById('mode-sandbox').classList.add('active');document.getElementById('mode-test').classList.remove('active');sandboxHint.classList.add('show');updateStats()});

let firing=false;
fireBtn.addEventListener('click',()=>{
  if(firing&&!sandboxMode)return;
  const{vehicle,armor,proj}=getCurrent();
  const effective=vehicle.baseArmor*armor.multiplier;
  let pen=proj.penetration;
  if(proj.type==='chemical'&&(armor.id.includes('era')||armor.id==='relikt'||armor.id==='cage'))pen*=0.75;
  if(proj.type==='kinetic'&&(armor.id==='du'||armor.id==='chobham'))pen*=0.9;
  let intercepted=false;
  if((armor.id==='trophy'||armor.id==='iron_fist')&&/javelin|kornet|drone|hellfire|spike|tow|brimstone|maverick|nlaw/.test(proj.id)){if(Math.random()<0.7)intercepted=true}
  const success=!intercepted&&pen>effective*(0.92+Math.random()*0.12);
  if(!sandboxMode){firing=true;fireBtn.disabled=true}
  resultEl.className='result idle';resultEl.textContent='Inbound…';
  const start=new THREE.Vector3(15+Math.random()*2.5,4+Math.random()*2,(Math.random()-0.5)*6);
  const end=new THREE.Vector3((Math.random()-0.5)*2,1.6+Math.random()*0.6,(Math.random()-0.5)*1.2);
  if(!projectileMesh)createProjectileVisual(proj);
  projectileMesh.position.copy(start);projectileMesh.visible=true;projectileMesh.lookAt(end);
  const trail=new THREE.PointLight(0xffaa66,1.2,6,2);trail.position.copy(start);scene.add(trail);
  const duration=750+(1-Math.min(proj.velocity,1700)/1700)*480;const t0=performance.now();const mesh=projectileMesh;
  function fly(now){
    const t=Math.min(1,(now-t0)/duration);const ease=t*t*(3-2*t);
    mesh.position.lerpVectors(start,end,ease);mesh.position.y-=Math.sin(t*Math.PI)*0.55*(1-proj.velocity/2000);
    trail.position.copy(mesh.position);
    if(t<1)requestAnimationFrame(fly);
    else{
      mesh.visible=false;scene.remove(trail);spawnImpact(end,success&&!intercepted);
      if(intercepted){resultEl.className='result nope';resultEl.textContent='Intercepted — APS'}
      else if(success){resultEl.className='result pen';resultEl.textContent='Penetration';if(turretGroup){turretGroup.rotation.z=(Math.random()-0.5)*0.05;setTimeout(()=>{if(turretGroup)turretGroup.rotation.z=0},300)}}
      else{resultEl.className='result nope';resultEl.textContent='No penetration'}
      if(!sandboxMode){firing=false;fireBtn.disabled=false}
    }
  }
  requestAnimationFrame(fly);
});

buildVehicle(VEHICLES[0]);updateStats();
setTimeout(()=>document.getElementById('loader').classList.add('hidden'),700);
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
function animate(){
  requestAnimationFrame(animate);controls.update();
  for(let i=impactParticles.length-1;i>=0;i--){
    const p=impactParticles[i];p.userData.life-=0.022;p.position.add(p.userData.vel);p.userData.vel.y-=0.018;
    p.material.opacity=Math.max(0,p.userData.life);
    if(p.userData.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();impactParticles.splice(i,1)}
  }
  if(turretGroup&&!firing)turretGroup.rotation.y=Math.sin(performance.now()*0.00018)*0.025;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
