<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArmorTest — Warehouse Range</title>
  <link href="https://fonts.cdnfonts.com/css/bobloxclassic" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'BobloxClassic', 'Arial Black', Impact, sans-serif;
      background: #0a0a0f;
      color: #f0f0f0;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-wrap { position: fixed; inset: 0; z-index: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    #ui {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      width: 340px; max-height: calc(100vh - 32px); overflow-y: auto;
      background: rgba(12, 14, 22, 0.94);
      border: 3px solid #3a3a4a; border-radius: 8px; padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.65);
    }
    #ui h1 {
      font-size: 22px; letter-spacing: 1px; color: #ffcc33;
      text-shadow: 2px 2px 0 #000; margin-bottom: 4px;
    }
    #ui .sub {
      font-size: 12px; color: #8899aa; margin-bottom: 14px;
      font-family: system-ui, sans-serif; font-weight: 400;
    }
    label {
      display: block; font-size: 13px; color: #aaccff;
      margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    select, button {
      width: 100%; padding: 10px 12px;
      font-family: 'BobloxClassic', sans-serif; font-size: 15px;
      background: #1a1e2a; color: #fff;
      border: 2px solid #4a5568; border-radius: 4px;
      cursor: pointer; outline: none;
    }
    select:hover, button:hover { border-color: #ffcc33; background: #252a3a; }
    button.fire {
      margin-top: 16px;
      background: linear-gradient(180deg, #c0392b, #8b1a1a);
      border-color: #e74c3c; font-size: 18px; letter-spacing: 1px;
      text-shadow: 1px 1px 0 #000;
    }
    button.fire:hover {
      background: linear-gradient(180deg, #e74c3c, #c0392b);
      border-color: #ff6b5a;
    }
    button.fire:active { transform: scale(0.98); }

    .stats {
      margin-top: 14px; padding: 10px; background: #12151f;
      border-radius: 4px; font-family: system-ui, sans-serif;
      font-size: 13px; line-height: 1.5; border: 1px solid #2a2e3a;
    }
    .stats strong { color: #ffcc33; }
    .result {
      margin-top: 10px; padding: 8px; border-radius: 4px;
      font-weight: bold; text-align: center; min-height: 36px;
      display: flex; align-items: center; justify-content: center;
    }
    .result.pen { background: #1a3a1a; color: #4ade80; border: 1px solid #22c55e; }
    .result.nope { background: #3a1a1a; color: #f87171; border: 1px solid #ef4444; }
    .result.idle { background: #1a1e2a; color: #8899aa; border: 1px solid #3a3a4a; }

    #country-badge {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      background: rgba(12,14,22,0.92); border: 3px solid #3a3a4a;
      border-radius: 8px; padding: 10px 16px; font-size: 16px;
      color: #ffcc33; display: flex; align-items: center; gap: 10px;
    }
    #country-badge img {
      width: 36px; height: 24px; object-fit: cover;
      border: 1px solid #555; border-radius: 2px;
    }

    #help {
      position: fixed; bottom: 16px; right: 16px; z-index: 10;
      background: rgba(12,14,22,0.88); border: 2px solid #3a3a4a;
      border-radius: 6px; padding: 8px 12px;
      font-family: system-ui, sans-serif; font-size: 12px;
      color: #8899aa; max-width: 280px;
    }

    #loader {
      position: fixed; inset: 0; z-index: 100; background: #0a0a0f;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 26px; color: #ffcc33;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loader">LOADING WAREHOUSE RANGE...</div>
  <div id="canvas-wrap"></div>

  <div id="country-badge">
    <img id="flag-icon" src="" alt="" />
    <span id="country-name">United States</span>
  </div>

  <div id="ui">
    <h1>ARMORTEST</h1>
    <div class="sub">Warehouse Armor Range • Boblox Edition</div>

    <label>Tank</label>
    <select id="tank-select"></select>

    <label>Armor Package</label>
    <select id="armor-select"></select>

    <label>Projectile</label>
    <select id="proj-select"></select>

    <button class="fire" id="fire-btn">FIRE!</button>

    <div class="stats" id="stats">Select a setup and hit FIRE.</div>
    <div class="result idle" id="result">Ready</div>
  </div>

  <div id="help">
    Drag to orbit • Scroll to zoom<br>
    Flag on the back wall changes with the tank
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const TANKS = [
      { id: 'm1a2', name: 'M1A2 Abrams', country: 'United States', flagCode: 'us', baseArmor: 600, color: 0x4a5c3a, accent: 0x3a4a2e, style: 'abrams' },
      { id: 'leo2', name: 'Leopard 2A7', country: 'Germany', flagCode: 'de', baseArmor: 580, color: 0x3d4a2e, accent: 0x2e3a22, style: 'leopard' },
      { id: 't90', name: 'T-90M', country: 'Russia', flagCode: 'ru', baseArmor: 550, color: 0x3a4a2a, accent: 0x2a3a1e, style: 't90' },
      { id: 'challenger', name: 'Challenger 2', country: 'United Kingdom', flagCode: 'gb', baseArmor: 620, color: 0x4a4a32, accent: 0x3a3a28, style: 'challenger' },
      { id: 'merkava', name: 'Merkava Mk.4', country: 'Israel', flagCode: 'il', baseArmor: 590, color: 0x5a5a3a, accent: 0x4a4a2e, style: 'merkava' },
      { id: 'type99', name: 'Type 99A', country: 'China', flagCode: 'cn', baseArmor: 540, color: 0x3a4a28, accent: 0x2a3a1c, style: 'type99' },
      { id: 'k2', name: 'K2 Black Panther', country: 'South Korea', flagCode: 'kr', baseArmor: 570, color: 0x3a4530, accent: 0x2a3520, style: 'k2' },
      { id: 'leclerc', name: 'Leclerc', country: 'France', flagCode: 'fr', baseArmor: 560, color: 0x4a5238, accent: 0x3a4230, style: 'leclerc' },
      { id: 'ariete', name: 'C1 Ariete', country: 'Italy', flagCode: 'it', baseArmor: 500, color: 0x455038, accent: 0x354028, style: 'ariete' },
      { id: 't84', name: 'T-84 Oplot', country: 'Ukraine', flagCode: 'ua', baseArmor: 520, color: 0x3a4828, accent: 0x2a381c, style: 't84' }
    ];

    const ARMORS = [
      { id: 'stock', name: 'Stock Composite', multiplier: 1.0 },
      { id: 'era', name: 'ERA Blocks (Kontakt-5 style)', multiplier: 1.35 },
      { id: 'nera', name: 'NERA + Spaced', multiplier: 1.25 },
      { id: 'du', name: 'Depleted Uranium Mesh', multiplier: 1.45 },
      { id: 'chobham', name: 'Chobham / Dorchester', multiplier: 1.5 },
      { id: 'relikt', name: 'Relikt ERA', multiplier: 1.55 },
      { id: 'trophy', name: 'Trophy APS + Composite', multiplier: 1.7 },
      { id: 'iron_fist', name: 'Iron Fist APS', multiplier: 1.65 },
      { id: 'lightweight', name: 'Lightweight Modular', multiplier: 0.85 },
      { id: 'experimental', name: 'Experimental Nanocomposite', multiplier: 1.9 }
    ];

    const PROJECTILES = [
      { id: 'oyster', name: 'Oyster Shell (hand-thrown)', penetration: 2, type: 'kinetic', velocity: 15, note: 'Basically nothing' },
      { id: 'rock', name: 'Large Rock', penetration: 8, type: 'kinetic', velocity: 25, note: 'Still nothing' },
      { id: '50bmg', name: '.50 BMG AP', penetration: 25, type: 'kinetic', velocity: 900, note: 'Small arms' },
      { id: '20mm', name: '20mm AP', penetration: 50, type: 'kinetic', velocity: 1000, note: 'Autocannon' },
      { id: '30mm', name: '30mm APFSDS', penetration: 90, type: 'kinetic', velocity: 1200, note: 'IFV gun' },
      { id: '105heat', name: '105mm HEAT', penetration: 400, type: 'chemical', velocity: 1100, note: 'Shaped charge' },
      { id: '120heat', name: '120mm HEAT-MP', penetration: 550, type: 'chemical', velocity: 1150, note: 'Modern HEAT' },
      { id: '120apfsds', name: '120mm APFSDS (DU)', penetration: 700, type: 'kinetic', velocity: 1650, note: 'Main gun KE' },
      { id: '125apfsds', name: '125mm APFSDS', penetration: 680, type: 'kinetic', velocity: 1700, note: 'Eastern KE' },
      { id: 'rpg7', name: 'RPG-7 PG-7VR', penetration: 600, type: 'chemical', velocity: 300, note: 'Tandem warhead' },
      { id: 'javelin', name: 'FGM-148 Javelin', penetration: 800, type: 'chemical', velocity: 200, note: 'Top-attack ATGM' },
      { id: 'kornet', name: '9M133 Kornet', penetration: 1000, type: 'chemical', velocity: 250, note: 'Heavy ATGM' },
      { id: 'drone_fpv', name: 'FPV Drone (shaped charge)', penetration: 350, type: 'chemical', velocity: 80, note: 'Cheap kamikaze' },
      { id: 'drone_switch', name: 'Switchblade 600', penetration: 450, type: 'chemical', velocity: 100, note: 'Loitering munition' },
      { id: 'hellfire', name: 'AGM-114 Hellfire', penetration: 900, type: 'chemical', velocity: 425, note: 'Air-to-surface' },
      { id: 'brimstone', name: 'Brimstone 2', penetration: 950, type: 'chemical', velocity: 450, note: 'Air-to-surface' },
      { id: 'maverick', name: 'AGM-65 Maverick', penetration: 1100, type: 'chemical', velocity: 300, note: 'Heavy ASM' },
      { id: 'spike_nlos', name: 'Spike NLOS', penetration: 1000, type: 'chemical', velocity: 180, note: 'Long-range ATGM' },
      { id: 'excalibur', name: 'M982 Excalibur (direct)', penetration: 300, type: 'kinetic', velocity: 800, note: 'Guided artillery' },
      { id: 'tow', name: 'BGM-71 TOW', penetration: 900, type: 'chemical', velocity: 278, note: 'Wire-guided' }
    ];

    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1c22);
    scene.fog = new THREE.Fog(0x1a1c22, 35, 90);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(14, 8, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 6;
    controls.maxDistance = 40;
    controls.target.set(0, 1.8, 0);

    const W = 48, D = 36, H = 14;

    const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a3a38, roughness: 0.85, metalness: 0.1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const markMat = new THREE.MeshBasicMaterial({ color: 0x555544 });
    for (let i = -3; i <= 3; i++) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.08, D * 0.85), markMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(i * 5.5, 0.01, 0);
      scene.add(line);
    }

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4a48, roughness: 0.9, metalness: 0.05, side: THREE.DoubleSide });
    const wallMatDark = new THREE.MeshStandardMaterial({ color: 0x353534, roughness: 0.9, metalness: 0.05, side: THREE.DoubleSide });

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMatDark);
    backWall.position.set(0, H / 2, -D / 2);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(W, 2.2), wallMat);
    frontWall.position.set(0, 1.1, D / 2);
    frontWall.rotation.y = Math.PI;
    scene.add(frontWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(D, H), wallMat);
    leftWall.position.set(-W / 2, H / 2, 0);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(D, H), wallMat);
    rightWall.position.set(W / 2, H / 2, 0);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.receiveShadow = true;
    scene.add(rightWall);

    const roofMat = new THREE.MeshStandardMaterial({ color: 0x2e2e2c, roughness: 0.95, metalness: 0.15, side: THREE.DoubleSide });
    const roof = new THREE.Mesh(new THREE.PlaneGeometry(W + 2, D + 2), roofMat);
    roof.rotation.x = Math.PI / 2;
    roof.position.y = H;
    scene.add(roof);

    const beamMat = new THREE.MeshStandardMaterial({ color: 0x222220, roughness: 0.7, metalness: 0.4 });
    for (let i = -4; i <= 4; i++) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(W - 1, 0.35, 0.35), beamMat);
      beam.position.set(0, H - 0.3, i * (D / 9));
      scene.add(beam);
    }
    for (let i = -5; i <= 5; i++) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, D - 1), beamMat);
      beam.position.set(i * (W / 11), H - 0.55, 0);
      scene.add(beam);
    }

    const corrMat = new THREE.MeshStandardMaterial({ color: 0x3a3a38, roughness: 0.6, metalness: 0.3 });
    for (let y = 1; y < H - 1; y += 1.4) {
      const stripL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.9, D - 2), corrMat);
      stripL.position.set(-W / 2 + 0.08, y, 0);
      scene.add(stripL);
      const stripR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.9, D - 2), corrMat);
      stripR.position.set(W / 2 - 0.08, y, 0);
      scene.add(stripR);
    }

    const lightGeo = new THREE.BoxGeometry(2.5, 0.2, 0.8);
    const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffcc, emissiveIntensity: 0.8, roughness: 0.4 });
    const lampPositions = [
      [-12, H - 0.8, -8], [0, H - 0.8, -8], [12, H - 0.8, -8],
      [-12, H - 0.8, 4], [0, H - 0.8, 4], [12, H - 0.8, 4],
      [-12, H - 0.8, 12], [0, H - 0.8, 12], [12, H - 0.8, 12]
    ];
    lampPositions.forEach(([x, y, z]) => {
      const lamp = new THREE.Mesh(lightGeo, lightMat);
      lamp.position.set(x, y, z);
      scene.add(lamp);
      const pl = new THREE.PointLight(0xfff5e0, 1.4, 28, 1.5);
      pl.position.set(x, y - 0.5, z);
      scene.add(pl);
    });

    scene.add(new THREE.AmbientLight(0x667788, 0.35));
    const key = new THREE.DirectionalLight(0xfff0dd, 0.55);
    key.position.set(8, 18, 10);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 60;
    key.shadow.camera.left = -20;
    key.shadow.camera.right = 20;
    key.shadow.camera.top = 20;
    key.shadow.camera.bottom = -20;
    scene.add(key);

    const crateMat = new THREE.MeshStandardMaterial({ color: 0x6b5344, roughness: 0.85, metalness: 0.05 });
    const crateMat2 = new THREE.MeshStandardMaterial({ color: 0x4a4a42, roughness: 0.8, metalness: 0.15 });
    function addCrate(x, z, sx, sy, sz, m) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
      c.position.set(x, sy / 2, z);
      c.castShadow = true;
      c.receiveShadow = true;
      scene.add(c);
    }
    addCrate(-18, -12, 2.2, 1.6, 1.8, crateMat);
    addCrate(-18, -9.5, 1.8, 1.2, 1.5, crateMat2);
    addCrate(18, -11, 2.4, 1.8, 2.0, crateMat);
    addCrate(17.5, -8, 1.6, 1.0, 1.4, crateMat2);
    addCrate(-17, 10, 2.0, 1.4, 1.6, crateMat);
    addCrate(17, 11, 2.2, 1.5, 1.8, crateMat2);
    addCrate(-16, 13, 1.5, 0.9, 1.3, crateMat);

    const flagW = 10, flagH = 6;
    const flagCanvas = document.createElement('canvas');
    flagCanvas.width = 640;
    flagCanvas.height = 384;
    const flagCtx = flagCanvas.getContext('2d');
    const flagTex = new THREE.CanvasTexture(flagCanvas);
    flagTex.colorSpace = THREE.SRGBColorSpace;
    const flagMat = new THREE.MeshStandardMaterial({
      map: flagTex, roughness: 0.7, metalness: 0.05, side: THREE.DoubleSide
    });
    const flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(flagW, flagH), flagMat);
    flagMesh.position.set(0, H / 2 + 0.5, -D / 2 + 0.08);
    scene.add(flagMesh);

    const frameMat = new THREE.MeshStandardMaterial({ color: 0x222220, metalness: 0.5, roughness: 0.4 });
    const frame = new THREE.Mesh(new THREE.BoxGeometry(flagW + 0.4, flagH + 0.4, 0.12), frameMat);
    frame.position.set(0, H / 2 + 0.5, -D / 2 + 0.02);
    scene.add(frame);

    const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7, roughness: 0.3 });
    [[-flagW / 2 - 0.1, H / 2 + 0.5 + flagH / 2], [flagW / 2 + 0.1, H / 2 + 0.5 + flagH / 2]].forEach(([px, py]) => {
      const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 8), poleMat);
      mount.rotation.z = Math.PI / 2;
      mount.position.set(px, py, -D / 2 + 0.15);
      scene.add(mount);
    });

    function setFlag(code) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        flagCtx.clearRect(0, 0, 640, 384);
        flagCtx.fillStyle = '#222';
        flagCtx.fillRect(0, 0, 640, 384);
        flagCtx.drawImage(img, 0, 0, 640, 384);
        flagTex.needsUpdate = true;
      };
      img.onerror = () => {
        flagCtx.fillStyle = '#333';
        flagCtx.fillRect(0, 0, 640, 384);
        flagCtx.fillStyle = '#ffcc33';
        flagCtx.font = 'bold 48px sans-serif';
        flagCtx.textAlign = 'center';
        flagCtx.fillText(code.toUpperCase(), 320, 200);
        flagTex.needsUpdate = true;
      };
      img.src = 'https://flagcdn.com/w640/' + code + '.png';
      document.getElementById('flag-icon').src = 'https://flagcdn.com/w80/' + code + '.png';
    }

    let tankGroup = null;
    let turretGroup = null;

    function mat(color, rough = 0.65, metal = 0.35) {
      return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
    }

    function addBox(parent, geo, material, x, y, z, rx = 0, ry = 0, rz = 0) {
      const m = new THREE.Mesh(geo, material);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    function buildTracks(parent, length, height, width, side, dark, track) {
      addBox(parent, new THREE.BoxGeometry(length * 0.95, height * 0.22, width * 0.2), track,
        0, height * 0.12, side * (width * 0.42));
      const wheelR = height * 0.11;
      for (let i = 0; i < 7; i++) {
        const wx = -length * 0.38 + i * (length * 0.12);
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(wheelR, wheelR, width * 0.16, 14),
          dark
        );
        wheel.rotation.x = Math.PI / 2;
        wheel.position.set(wx, height * 0.11, side * (width * 0.42));
        wheel.castShadow = true;
        parent.add(wheel);
      }
      [-length * 0.42, length * 0.42].forEach(wx => {
        const sprocket = new THREE.Mesh(
          new THREE.CylinderGeometry(wheelR * 1.15, wheelR * 1.15, width * 0.14, 12),
          dark
        );
        sprocket.rotation.x = Math.PI / 2;
        sprocket.position.set(wx, height * 0.13, side * (width * 0.42));
        parent.add(sprocket);
      });
      addBox(parent, new THREE.BoxGeometry(length * 0.88, height * 0.28, 0.06), track,
        0, height * 0.28, side * (width * 0.52));
    }

    function buildGun(parent, length, height, dark, gunLength = 5.5) {
      addBox(parent, new THREE.BoxGeometry(0.5, 0.55, 0.7), dark, 1.1, height * 0.82, 0);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, gunLength, 14), dark);
      barrel.rotation.z = Math.PI / 2;
      barrel.position.set(1.1 + gunLength / 2, height * 0.82, 0);
      barrel.castShadow = true;
      parent.add(barrel);
      for (let i = 0; i < 3; i++) {
        const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.145, 0.25, 12), dark);
        ring.rotation.z = Math.PI / 2;
        ring.position.set(2.2 + i * 1.1, height * 0.82, 0);
        parent.add(ring);
      }
      const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 0.35, 12), dark);
      muzzle.rotation.z = Math.PI / 2;
      muzzle.position.set(1.1 + gunLength + 0.1, height * 0.82, 0);
      parent.add(muzzle);
      const fume = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.55, 12), dark);
      fume.rotation.z = Math.PI / 2;
      fume.position.set(1.1 + gunLength * 0.55, height * 0.82, 0);
      parent.add(fume);
    }

    function buildTank(tank) {
      if (tankGroup) {
        scene.remove(tankGroup);
        tankGroup.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
            else o.material.dispose();
          }
        });
      }

      tankGroup = new THREE.Group();
      turretGroup = new THREE.Group();
      const body = mat(tank.color, 0.68, 0.32);
      const accent = mat(tank.accent, 0.7, 0.28);
      const dark = mat(0x1a1a1a, 0.55, 0.55);
      const track = mat(0x1e1e1c, 0.9, 0.15);

      const L = 9.7, Wd = 3.6, Hgt = 2.35;
      const style = tank.style;

      addBox(tankGroup, new THREE.BoxGeometry(L * 0.92, Hgt * 0.38, Wd * 0.88), body, 0, Hgt * 0.28, 0);

      if (style === 'abrams' || style === 'challenger' || style === 'k2') {
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.55, Hgt * 0.32, Wd * 0.86), body, -0.6, Hgt * 0.52, 0);
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.32, Hgt * 0.28, Wd * 0.84), body, L * 0.28, Hgt * 0.42, 0, 0, 0, -0.42);
      } else if (style === 'leopard' || style === 'leclerc' || style === 'ariete') {
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.5, Hgt * 0.3, Wd * 0.86), body, -0.5, Hgt * 0.5, 0);
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.35, Hgt * 0.26, Wd * 0.84), body, L * 0.26, Hgt * 0.4, 0, 0, 0, -0.38);
      } else if (style === 'merkava') {
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.48, Hgt * 0.34, Wd * 0.86), body, -0.3, Hgt * 0.52, 0);
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.38, Hgt * 0.3, Wd * 0.84), body, L * 0.3, Hgt * 0.44, 0, 0, 0, -0.28);
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.22, Hgt * 0.18, Wd * 0.7), accent, L * 0.38, Hgt * 0.58, 0);
      } else {
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.52, Hgt * 0.28, Wd * 0.86), body, -0.4, Hgt * 0.48, 0);
        addBox(tankGroup, new THREE.BoxGeometry(L * 0.34, Hgt * 0.24, Wd * 0.84), body, L * 0.28, Hgt * 0.38, 0, 0, 0, -0.45);
      }

      buildTracks(tankGroup, L, Hgt, Wd, -1, dark, track);
      buildTracks(tankGroup, L, Hgt, Wd, 1, dark, track);

      addBox(tankGroup, new THREE.BoxGeometry(L * 0.18, Hgt * 0.22, Wd * 0.7), accent, -L * 0.42, Hgt * 0.48, 0);
      [-0.5, 0.5].forEach(sz => {
        addBox(tankGroup, new THREE.CylinderGeometry(0.12, 0.12, 0.5, 8), dark, -L * 0.48, Hgt * 0.55, sz * Wd * 0.25, 0, 0, Math.PI / 2);
      });

      if (style === 'abrams') {
        addBox(turretGroup, new THREE.BoxGeometry(3.8, 0.85, 2.9), body, 0.2, Hgt * 0.78, 0);
        addBox(turretGroup, new THREE.BoxGeometry(2.2, 0.55, 2.6), body, -1.3, Hgt * 0.72, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.0, 0.4, 2.5), body, 1.6, Hgt * 0.7, 0);
        addBox(turretGroup, new THREE.BoxGeometry(0.5, 0.35, 0.55), dark, 0.8, Hgt * 1.05, 0.7);
        addBox(turretGroup, new THREE.CylinderGeometry(0.28, 0.32, 0.3, 12), body, 0.3, Hgt * 1.05, -0.6);
        buildGun(turretGroup, L, Hgt, dark, 5.8);
      } else if (style === 'leopard') {
        addBox(turretGroup, new THREE.BoxGeometry(3.6, 0.75, 2.7), body, 0.15, Hgt * 0.76, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.8, 0.5, 2.4), body, -1.4, Hgt * 0.7, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.2, 0.55, 2.5), body, 1.4, Hgt * 0.72, 0, 0, 0, -0.15);
        addBox(turretGroup, new THREE.BoxGeometry(0.45, 0.3, 0.5), dark, 0.9, Hgt * 1.0, 0.65);
        buildGun(turretGroup, L, Hgt, dark, 5.5);
      } else if (style === 't90' || style === 't84') {
        const turretCore = new THREE.Mesh(new THREE.SphereGeometry(1.55, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), body);
        turretCore.position.set(0.1, Hgt * 0.55, 0);
        turretCore.scale.set(1.15, 0.7, 1.0);
        turretCore.castShadow = true;
        turretGroup.add(turretCore);
        addBox(turretGroup, new THREE.BoxGeometry(1.6, 0.45, 2.2), body, -1.2, Hgt * 0.72, 0);
        for (let i = -2; i <= 2; i++) {
          addBox(turretGroup, new THREE.BoxGeometry(0.35, 0.25, 0.5), accent, 0.9, Hgt * 0.95, i * 0.45);
          addBox(turretGroup, new THREE.BoxGeometry(0.35, 0.25, 0.5), accent, -0.3, Hgt * 0.95, i * 0.45);
        }
        addBox(turretGroup, new THREE.BoxGeometry(0.25, 0.2, 0.35), dark, 1.3, Hgt * 0.9, 0.9);
        addBox(turretGroup, new THREE.BoxGeometry(0.25, 0.2, 0.35), dark, 1.3, Hgt * 0.9, -0.9);
        buildGun(turretGroup, L, Hgt, dark, 5.2);
      } else if (style === 'challenger') {
        addBox(turretGroup, new THREE.BoxGeometry(4.2, 0.8, 2.8), body, 0, Hgt * 0.78, 0);
        addBox(turretGroup, new THREE.BoxGeometry(2.0, 0.5, 2.5), body, -1.6, Hgt * 0.7, 0);
        addBox(turretGroup, new THREE.BoxGeometry(0.5, 0.35, 0.5), dark, 0.7, Hgt * 1.05, 0.7);
        buildGun(turretGroup, L, Hgt, dark, 5.6);
      } else if (style === 'merkava') {
        addBox(turretGroup, new THREE.BoxGeometry(3.4, 0.9, 2.8), body, -0.2, Hgt * 0.8, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.5, 0.6, 2.5), body, -1.6, Hgt * 0.75, 0);
        addBox(turretGroup, new THREE.BoxGeometry(0.15, 0.7, 2.6), accent, 1.5, Hgt * 0.75, 0);
        addBox(turretGroup, new THREE.CylinderGeometry(0.25, 0.28, 0.35, 10), body, 0.4, Hgt * 1.1, 0.5);
        buildGun(turretGroup, L, Hgt, dark, 5.0);
      } else if (style === 'type99' || style === 'k2') {
        addBox(turretGroup, new THREE.BoxGeometry(3.5, 0.7, 2.6), body, 0.1, Hgt * 0.75, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.7, 0.45, 2.3), body, -1.3, Hgt * 0.7, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.1, 0.5, 2.4), body, 1.3, Hgt * 0.72, 0, 0, 0, -0.12);
        addBox(turretGroup, new THREE.BoxGeometry(0.4, 0.28, 0.45), dark, 0.8, Hgt * 0.98, 0.6);
        buildGun(turretGroup, L, Hgt, dark, 5.4);
      } else {
        addBox(turretGroup, new THREE.BoxGeometry(3.3, 0.72, 2.55), body, 0.15, Hgt * 0.76, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.5, 0.45, 2.2), body, -1.2, Hgt * 0.7, 0);
        addBox(turretGroup, new THREE.BoxGeometry(1.0, 0.5, 2.3), body, 1.25, Hgt * 0.72, 0, 0, 0, -0.18);
        addBox(turretGroup, new THREE.BoxGeometry(0.4, 0.28, 0.45), dark, 0.7, Hgt * 0.98, 0.55);
        buildGun(turretGroup, L, Hgt, dark, 5.3);
      }

      addBox(turretGroup, new THREE.CylinderGeometry(0.35, 0.4, 0.28, 12), body, 0.4, Hgt * 1.12, style === 'merkava' ? -0.4 : 0.45);

      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.2, 6), dark);
      ant.position.set(-0.8, Hgt * 1.5, 0.9);
      turretGroup.add(ant);

      tankGroup.add(turretGroup);
      scene.add(tankGroup);

      setFlag(tank.flagCode);
      document.getElementById('country-name').textContent = tank.country;
    }

    let projectileMesh = null;
    let impactParticles = [];

    function createProjectileVisual(proj) {
      if (projectileMesh) {
        scene.remove(projectileMesh);
        projectileMesh.geometry?.dispose();
        projectileMesh.material?.dispose();
      }
      let geo, material;
      if (proj.id === 'oyster' || proj.id === 'rock') {
        geo = new THREE.DodecahedronGeometry(0.22, 0);
        material = mat(0x888877, 0.9, 0.05);
      } else if (proj.id.includes('drone')) {
        geo = new THREE.BoxGeometry(0.55, 0.12, 0.7);
        material = mat(0x2a2a2a, 0.5, 0.6);
      } else if (proj.type === 'chemical') {
        geo = new THREE.ConeGeometry(0.1, 0.65, 8);
        material = mat(0xcc4422, 0.5, 0.4);
      } else {
        geo = new THREE.CylinderGeometry(0.05, 0.07, 0.85, 8);
        material = mat(0xccccaa, 0.4, 0.7);
      }
      projectileMesh = new THREE.Mesh(geo, material);
      projectileMesh.visible = false;
      scene.add(projectileMesh);
    }

    function spawnImpact(pos, success) {
      const color = success ? 0x44ff66 : 0xff4422;
      for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.07 + Math.random() * 0.1, 6, 6),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
        );
        p.position.copy(pos);
        p.userData.vel = new THREE.Vector3(
          (Math.random() - 0.5) * 0.45,
          Math.random() * 0.55 + 0.1,
          (Math.random() - 0.5) * 0.45
        );
        p.userData.life = 1;
        scene.add(p);
        impactParticles.push(p);
      }
    }

    const tankSelect = document.getElementById('tank-select');
    const armorSelect = document.getElementById('armor-select');
    const projSelect = document.getElementById('proj-select');
    const statsEl = document.getElementById('stats');
    const resultEl = document.getElementById('result');
    const fireBtn = document.getElementById('fire-btn');

    TANKS.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      if (t.id === 'm1a2') opt.selected = true;
      tankSelect.appendChild(opt);
    });
    ARMORS.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      armorSelect.appendChild(opt);
    });
    PROJECTILES.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      projSelect.appendChild(opt);
    });

    function getCurrent() {
      return {
        tank: TANKS.find(t => t.id === tankSelect.value),
        armor: ARMORS.find(a => a.id === armorSelect.value),
        proj: PROJECTILES.find(p => p.id === projSelect.value)
      };
    }

    function updateStats() {
      const { tank, armor, proj } = getCurrent();
      const effective = Math.round(tank.baseArmor * armor.multiplier);
      statsEl.innerHTML = '<strong>' + tank.name + '</strong> (' + tank.country + ')<br>' +
        'Base armor: ' + tank.baseArmor + ' mm RHA<br>' +
        'Package: ' + armor.name + ' (×' + armor.multiplier + ') → <strong>' + effective + ' mm</strong><br>' +
        'Projectile: ' + proj.name + '<br>' +
        'Pen: ' + proj.penetration + ' mm • ' + proj.type + ' • ' + proj.velocity + ' m/s<br>' +
        '<em style="color:#8899aa">' + proj.note + '</em>';
      resultEl.className = 'result idle';
      resultEl.textContent = 'Ready';
      createProjectileVisual(proj);
    }

    tankSelect.addEventListener('change', () => {
      buildTank(TANKS.find(t => t.id === tankSelect.value));
      updateStats();
    });
    armorSelect.addEventListener('change', updateStats);
    projSelect.addEventListener('change', updateStats);

    let firing = false;

    fireBtn.addEventListener('click', () => {
      if (firing) return;
      const { tank, armor, proj } = getCurrent();
      const effective = tank.baseArmor * armor.multiplier;
      let pen = proj.penetration;
      if ((proj.type === 'chemical' && (armor.id.includes('era') || armor.id === 'relikt'))) pen *= 0.75;
      if (proj.type === 'kinetic' && (armor.id === 'du' || armor.id === 'chobham')) pen *= 0.9;

      let intercepted = false;
      if ((armor.id === 'trophy' || armor.id === 'iron_fist') &&
          /javelin|kornet|drone|hellfire|spike|tow|brimstone|maverick/.test(proj.id)) {
        if (Math.random() < 0.72) intercepted = true;
      }

      const success = !intercepted && pen > effective * (0.92 + Math.random() * 0.12);

      firing = true;
      fireBtn.disabled = true;
      resultEl.className = 'result idle';
      resultEl.textContent = 'Inbound...';

      const start = new THREE.Vector3(18, 5 + Math.random() * 2, (Math.random() - 0.5) * 6);
      const end = new THREE.Vector3((Math.random() - 0.5) * 2, 1.9 + Math.random() * 0.6, (Math.random() - 0.5) * 1.2);
      projectileMesh.position.copy(start);
      projectileMesh.visible = true;
      projectileMesh.lookAt(end);

      const duration = 850 + (1 - Math.min(proj.velocity, 1700) / 1700) * 550;
      const t0 = performance.now();

      function fly(now) {
        const t = Math.min(1, (now - t0) / duration);
        const ease = t * t * (3 - 2 * t);
        projectileMesh.position.lerpVectors(start, end, ease);
        projectileMesh.position.y -= Math.sin(t * Math.PI) * 0.7 * (1 - proj.velocity / 2000);

        if (t < 1) {
          requestAnimationFrame(fly);
        } else {
          projectileMesh.visible = false;
          spawnImpact(end, success && !intercepted);
          if (intercepted) {
            resultEl.className = 'result nope';
            resultEl.textContent = 'INTERCEPTED by APS';
          } else if (success) {
            resultEl.className = 'result pen';
            resultEl.textContent = 'PENETRATION — Armor defeated';
            if (turretGroup) {
              turretGroup.rotation.z = (Math.random() - 0.5) * 0.07;
              setTimeout(() => { if (turretGroup) turretGroup.rotation.z = 0; }, 400);
            }
          } else {
            resultEl.className = 'result nope';
            resultEl.textContent = 'DEFEATED — No penetration';
          }
          firing = false;
          fireBtn.disabled = false;
        }
      }
      requestAnimationFrame(fly);
    });

    buildTank(TANKS[0]);
    updateStats();
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 700);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      for (let i = impactParticles.length - 1; i >= 0; i--) {
        const p = impactParticles[i];
        p.userData.life -= 0.025;
        p.position.add(p.userData.vel);
        p.userData.vel.y -= 0.015;
        p.material.opacity = p.userData.life;
        if (p.userData.life <= 0) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          impactParticles.splice(i, 1);
        }
      }
      if (turretGroup && !firing) {
        turretGroup.rotation.y = Math.sin(performance.now() * 0.00025) * 0.035;
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
