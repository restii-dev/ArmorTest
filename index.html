<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArmorTest — 3D Tank Armor Range</title>
  <link href="https://fonts.cdnfonts.com/css/bobloxclassic" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'BobloxClassic', 'Arial Black', Impact, sans-serif;
      background: #0a0a0f;
      color: #f0f0f0;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* Flag backdrop overlay (subtle) */
    #flag-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.18;
      background-size: cover;
      background-position: center;
      transition: background-image 0.6s ease, opacity 0.4s;
    }

    /* UI Panel */
    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 340px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(12, 14, 22, 0.92);
      border: 3px solid #3a3a4a;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #ui h1 {
      font-size: 22px;
      letter-spacing: 1px;
      color: #ffcc33;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 4px;
    }
    #ui .sub {
      font-size: 12px;
      color: #8899aa;
      margin-bottom: 14px;
      font-family: system-ui, sans-serif;
      font-weight: 400;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaccff;
      margin: 10px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button {
      width: 100%;
      padding: 10px 12px;
      font-family: 'BobloxClassic', sans-serif;
      font-size: 15px;
      background: #1a1e2a;
      color: #fff;
      border: 2px solid #4a5568;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }
    select:hover, button:hover {
      border-color: #ffcc33;
      background: #252a3a;
    }
    button.fire {
      margin-top: 16px;
      background: linear-gradient(180deg, #c0392b, #8b1a1a);
      border-color: #e74c3c;
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #000;
    }
    button.fire:hover {
      background: linear-gradient(180deg, #e74c3c, #c0392b);
      border-color: #ff6b5a;
    }
    button.fire:active { transform: scale(0.98); }

    .stats {
      margin-top: 14px;
      padding: 10px;
      background: #12151f;
      border-radius: 4px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid #2a2e3a;
    }
    .stats strong { color: #ffcc33; }
    .result {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result.pen { background: #1a3a1a; color: #4ade80; border: 1px solid #22c55e; }
    .result.nope { background: #3a1a1a; color: #f87171; border: 1px solid #ef4444; }
    .result.idle { background: #1a1e2a; color: #8899aa; border: 1px solid #3a3a4a; }

    /* Country badge */
    #country-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(12,14,22,0.9);
      border: 3px solid #3a3a4a;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 16px;
      color: #ffcc33;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #country-badge img {
      width: 36px;
      height: 24px;
      object-fit: cover;
      border: 1px solid #555;
      border-radius: 2px;
    }

    /* Instructions */
    #help {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(12,14,22,0.85);
      border: 2px solid #3a3a4a;
      border-radius: 6px;
      padding: 8px 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: #8899aa;
      max-width: 280px;
    }

    /* Loading */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #ffcc33;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loader">LOADING ARMOR RANGE...</div>
  <div id="flag-bg"></div>
  <div id="canvas-wrap"></div>

  <div id="country-badge">
    <img id="flag-icon" src="" alt="" />
    <span id="country-name">United States</span>
  </div>

  <div id="ui">
    <h1>ARMORTEST</h1>
    <div class="sub">3D Tank Armor Range • Boblox Edition</div>

    <label>Tank</label>
    <select id="tank-select"></select>

    <label>Armor Package</label>
    <select id="armor-select"></select>

    <label>Projectile</label>
    <select id="proj-select"></select>

    <button class="fire" id="fire-btn">FIRE!</button>

    <div class="stats" id="stats">
      Select a setup and hit FIRE.
    </div>
    <div class="result idle" id="result">Ready</div>
  </div>

  <div id="help">
    Drag to orbit • Scroll to zoom<br>
    Flag changes with the tank's nation
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── Data ───────────────────────────────────────────────
    const TANKS = [
      {
        id: 'm1a2',
        name: 'M1A2 Abrams',
        country: 'United States',
        flagCode: 'us',
        baseArmor: 600, // RHA mm equivalent frontal
        color: 0x4a5a3a,
        size: { l: 9.8, w: 3.7, h: 2.4 }
      },
      {
        id: 'leo2',
        name: 'Leopard 2A7',
        country: 'Germany',
        flagCode: 'de',
        baseArmor: 580,
        color: 0x3d4a2e,
        size: { l: 10.0, w: 3.7, h: 2.5 }
      },
      {
        id: 't90',
        name: 'T-90M',
        country: 'Russia',
        flagCode: 'ru',
        baseArmor: 550,
        color: 0x3a4a2a,
        size: { l: 9.5, w: 3.8, h: 2.2 }
      },
      {
        id: 'challenger',
        name: 'Challenger 2',
        country: 'United Kingdom',
        flagCode: 'gb',
        baseArmor: 620,
        color: 0x4a4a32,
        size: { l: 11.5, w: 3.5, h: 2.5 }
      },
      {
        id: 'merkava',
        name: 'Merkava Mk.4',
        country: 'Israel',
        flagCode: 'il',
        baseArmor: 590,
        color: 0x5a5a3a,
        size: { l: 9.0, w: 3.7, h: 2.7 }
      },
      {
        id: 'type99',
        name: 'Type 99A',
        country: 'China',
        flagCode: 'cn',
        baseArmor: 540,
        color: 0x3a4a28,
        size: { l: 11.0, w: 3.5, h: 2.4 }
      },
      {
        id: 'k2',
        name: 'K2 Black Panther',
        country: 'South Korea',
        flagCode: 'kr',
        baseArmor: 570,
        color: 0x3a4530,
        size: { l: 10.8, w: 3.6, h: 2.4 }
      },
      {
        id: 'leclerc',
        name: 'Leclerc',
        country: 'France',
        flagCode: 'fr',
        baseArmor: 560,
        color: 0x4a5238,
        size: { l: 9.9, w: 3.6, h: 2.5 }
      },
      {
        id: 'ariete',
        name: 'C1 Ariete',
        country: 'Italy',
        flagCode: 'it',
        baseArmor: 500,
        color: 0x455038,
        size: { l: 9.5, w: 3.6, h: 2.5 }
      },
      {
        id: 't84',
        name: 'T-84 Oplot',
        country: 'Ukraine',
        flagCode: 'ua',
        baseArmor: 520,
        color: 0x3a4828,
        size: { l: 9.7, w: 3.8, h: 2.2 }
      }
    ];

    const ARMORS = [
      { id: 'stock', name: 'Stock Composite', multiplier: 1.0, note: 'Factory package' },
      { id: 'era', name: 'ERA Blocks (Kontakt-5 style)', multiplier: 1.35, note: '+35% vs KE/CE' },
      { id: 'nera', name: 'NERA + Spaced', multiplier: 1.25, note: 'Non-explosive reactive' },
      { id: 'du', name: 'Depleted Uranium Mesh', multiplier: 1.45, note: 'Heavy KE protection' },
      { id: 'chobham', name: 'Chobham / Dorchester', multiplier: 1.5, note: 'Advanced ceramic sandwich' },
      { id: 'relikt', name: 'Relikt ERA', multiplier: 1.55, note: 'Modern Russian ERA' },
      { id: 'trophy', name: 'Trophy APS + Composite', multiplier: 1.7, note: 'Active protection + base' },
      { id: 'iron_fist', name: 'Iron Fist APS', multiplier: 1.65, note: 'Hard-kill APS' },
      { id: 'lightweight', name: 'Lightweight Modular', multiplier: 0.85, note: 'Mobility over protection' },
      { id: 'experimental', name: 'Experimental Nanocomposite', multiplier: 1.9, note: 'Lab-only next-gen' }
    ];

    const PROJECTILES = [
      { id: 'oyster', name: 'Oyster Shell (hand-thrown)', penetration: 2, type: 'kinetic', velocity: 15, note: 'Basically nothing' },
      { id: 'rock', name: 'Large Rock', penetration: 8, type: 'kinetic', velocity: 25, note: 'Still nothing' },
      { id: '50bmg', name: '.50 BMG AP', penetration: 25, type: 'kinetic', velocity: 900, note: 'Small arms' },
      { id: '20mm', name: '20mm AP', penetration: 50, type: 'kinetic', velocity: 1000, note: 'Autocannon' },
      { id: '30mm', name: '30mm APFSDS', penetration: 90, type: 'kinetic', velocity: 1200, note: 'IFV gun' },
      { id: '105heat', name: '105mm HEAT', penetration: 400, type: 'chemical', velocity: 1100, note: 'Shaped charge' },
      { id: '120heat', name: '120mm HEAT-MP', penetration: 550, type: 'chemical', velocity: 1150, note: 'Modern HEAT' },
      { id: '120apfsds', name: '120mm APFSDS (DU)', penetration: 700, type: 'kinetic', velocity: 1650, note: 'Main gun KE' },
      { id: '125apfsds', name: '125mm APFSDS', penetration: 680, type: 'kinetic', velocity: 1700, note: 'Eastern KE' },
      { id: 'rpg7', name: 'RPG-7 PG-7VR', penetration: 600, type: 'chemical', velocity: 300, note: 'Tandem warhead' },
      { id: 'javelin', name: 'FGM-148 Javelin', penetration: 800, type: 'chemical', velocity: 200, note: 'Top-attack ATGM' },
      { id: 'kornet', name: '9M133 Kornet', penetration: 1000, type: 'chemical', velocity: 250, note: 'Heavy ATGM' },
      { id: 'drone_fpv', name: 'FPV Drone (shaped charge)', penetration: 350, type: 'chemical', velocity: 80, note: 'Cheap kamikaze' },
      { id: 'drone_switch', name: 'Switchblade 600', penetration: 450, type: 'chemical', velocity: 100, note: 'Loitering munition' },
      { id: 'hellfire', name: 'AGM-114 Hellfire', penetration: 900, type: 'chemical', velocity: 425, note: 'Air-to-surface' },
      { id: 'brimstone', name: 'Brimstone 2', penetration: 950, type: 'chemical', velocity: 450, note: 'Air-to-surface' },
      { id: 'maverick', name: 'AGM-65 Maverick', penetration: 1100, type: 'chemical', velocity: 300, note: 'Heavy ASM' },
      { id: 'spike_nlos', name: 'Spike NLOS', penetration: 1000, type: 'chemical', velocity: 180, note: 'Long-range ATGM' },
      { id: 'excalibur', name: 'M982 Excalibur (direct)', penetration: 300, type: 'kinetic', velocity: 800, note: 'Guided artillery' },
      { id: 'tow', name: 'BGM-71 TOW', penetration: 900, type: 'chemical', velocity: 278, note: 'Wire-guided' }
    ];

    // ─── Three.js Setup ─────────────────────────────────────
    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2030);
    scene.fog = new THREE.Fog(0x1a2030, 40, 120);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(18, 12, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 8;
    controls.maxDistance = 60;
    controls.target.set(0, 1.5, 0);

    // Lights
    const amb = new THREE.AmbientLight(0x6688aa, 0.45);
    scene.add(amb);
    const sun = new THREE.DirectionalLight(0xfff0dd, 1.1);
    sun.position.set(30, 40, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 100;
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x88aacc, 0.3);
    fill.position.set(-20, 10, -15);
    scene.add(fill);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x2a3228,
      roughness: 0.95,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid helper subtle
    const grid = new THREE.GridHelper(80, 40, 0x3a4a3a, 0x2a3228);
    grid.position.y = 0.02;
    scene.add(grid);

    // Impact zone marker
    const zoneGeo = new THREE.RingGeometry(4.5, 5, 48);
    const zoneMat = new THREE.MeshBasicMaterial({ color: 0x556633, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
    const zone = new THREE.Mesh(zoneGeo, zoneMat);
    zone.rotation.x = -Math.PI / 2;
    zone.position.y = 0.03;
    scene.add(zone);

    // ─── Tank Builder (procedural low-poly) ──────────────────
    let tankGroup = null;
    let turretGroup = null;

    function buildTank(tank) {
      if (tankGroup) {
        scene.remove(tankGroup);
        tankGroup.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
            else o.material.dispose();
          }
        });
      }

      tankGroup = new THREE.Group();
      const { l, w, h } = tank.size;
      const mat = new THREE.MeshStandardMaterial({
        color: tank.color,
        roughness: 0.7,
        metalness: 0.35
      });
      const darkMat = new THREE.MeshStandardMaterial({
        color: 0x1a1a1a,
        roughness: 0.6,
        metalness: 0.5
      });
      const trackMat = new THREE.MeshStandardMaterial({
        color: 0x222222,
        roughness: 0.9,
        metalness: 0.2
      });

      // Hull
      const hull = new THREE.Mesh(new THREE.BoxGeometry(l * 0.85, h * 0.55, w * 0.9), mat);
      hull.position.y = h * 0.35;
      hull.castShadow = true;
      hull.receiveShadow = true;
      tankGroup.add(hull);

      // Front slope
      const slope = new THREE.Mesh(new THREE.BoxGeometry(l * 0.25, h * 0.35, w * 0.85), mat);
      slope.position.set(l * 0.32, h * 0.28, 0);
      slope.rotation.z = -0.35;
      slope.castShadow = true;
      tankGroup.add(slope);

      // Tracks (left/right)
      [-1, 1].forEach(side => {
        const track = new THREE.Mesh(new THREE.BoxGeometry(l * 0.95, h * 0.28, w * 0.22), trackMat);
        track.position.set(0, h * 0.14, side * (w * 0.42));
        track.castShadow = true;
        tankGroup.add(track);

        // Road wheels
        for (let i = 0; i < 6; i++) {
          const wheel = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.12, h * 0.12, w * 0.18, 12), darkMat);
          wheel.rotation.x = Math.PI / 2;
          wheel.position.set(-l * 0.35 + i * (l * 0.14), h * 0.12, side * (w * 0.42));
          tankGroup.add(wheel);
        }
      });

      // Turret
      turretGroup = new THREE.Group();
      const turret = new THREE.Mesh(new THREE.BoxGeometry(l * 0.45, h * 0.4, w * 0.7), mat);
      turret.position.y = h * 0.75;
      turret.castShadow = true;
      turretGroup.add(turret);

      // Bustle
      const bustle = new THREE.Mesh(new THREE.BoxGeometry(l * 0.25, h * 0.3, w * 0.55), mat);
      bustle.position.set(-l * 0.2, h * 0.7, 0);
      bustle.castShadow = true;
      turretGroup.add(bustle);

      // Gun
      const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, l * 0.55, 12), darkMat);
      gun.rotation.z = Math.PI / 2;
      gun.position.set(l * 0.38, h * 0.78, 0);
      gun.castShadow = true;
      turretGroup.add(gun);

      // Muzzle
      const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.3, 10), darkMat);
      muzzle.rotation.z = Math.PI / 2;
      muzzle.position.set(l * 0.55, h * 0.78, 0);
      turretGroup.add(muzzle);

      // Cupola
      const cupola = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.25, 12), mat);
      cupola.position.set(0.3, h * 0.98, 0.4);
      turretGroup.add(cupola);

      tankGroup.add(turretGroup);
      tankGroup.position.set(0, 0, 0);
      scene.add(tankGroup);

      // Update flag
      updateFlag(tank);
    }

    function updateFlag(tank) {
      const code = tank.flagCode;
      const url = `https://flagcdn.com/w640/${code}.png`;
      document.getElementById('flag-bg').style.backgroundImage = `url(${url})`;
      document.getElementById('flag-icon').src = `https://flagcdn.com/w80/${code}.png`;
      document.getElementById('country-name').textContent = tank.country;
    }

    // ─── Projectile visual ──────────────────────────────────
    let projectileMesh = null;
    let impactParticles = [];

    function createProjectileVisual(proj) {
      if (projectileMesh) {
        scene.remove(projectileMesh);
        projectileMesh.geometry?.dispose();
        projectileMesh.material?.dispose();
      }
      let geo, mat;
      if (proj.id === 'oyster' || proj.id === 'rock') {
        geo = new THREE.DodecahedronGeometry(0.25, 0);
        mat = new THREE.MeshStandardMaterial({ color: 0x888877, roughness: 0.9 });
      } else if (proj.id.includes('drone')) {
        geo = new THREE.BoxGeometry(0.6, 0.15, 0.8);
        mat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6 });
      } else if (proj.type === 'chemical') {
        geo = new THREE.ConeGeometry(0.12, 0.7, 8);
        mat = new THREE.MeshStandardMaterial({ color: 0xcc4422, metalness: 0.4 });
      } else {
        geo = new THREE.CylinderGeometry(0.06, 0.08, 0.9, 8);
        mat = new THREE.MeshStandardMaterial({ color: 0xccccaa, metalness: 0.7 });
      }
      projectileMesh = new THREE.Mesh(geo, mat);
      projectileMesh.visible = false;
      scene.add(projectileMesh);
    }

    function spawnImpact(pos, success) {
      const color = success ? 0x44ff66 : 0xff4422;
      for (let i = 0; i < 18; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.08 + Math.random() * 0.1, 6, 6),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
        );
        p.position.copy(pos);
        p.userData.vel = new THREE.Vector3(
          (Math.random() - 0.5) * 0.4,
          Math.random() * 0.5 + 0.1,
          (Math.random() - 0.5) * 0.4
        );
        p.userData.life = 1;
        scene.add(p);
        impactParticles.push(p);
      }
    }

    // ─── UI Population ──────────────────────────────────────
    const tankSelect = document.getElementById('tank-select');
    const armorSelect = document.getElementById('armor-select');
    const projSelect = document.getElementById('proj-select');
    const statsEl = document.getElementById('stats');
    const resultEl = document.getElementById('result');
    const fireBtn = document.getElementById('fire-btn');

    TANKS.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      if (t.id === 'm1a2') opt.selected = true;
      tankSelect.appendChild(opt);
    });
    ARMORS.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      armorSelect.appendChild(opt);
    });
    PROJECTILES.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      projSelect.appendChild(opt);
    });

    function getCurrent() {
      const tank = TANKS.find(t => t.id === tankSelect.value);
      const armor = ARMORS.find(a => a.id === armorSelect.value);
      const proj = PROJECTILES.find(p => p.id === projSelect.value);
      return { tank, armor, proj };
    }

    function updateStats() {
      const { tank, armor, proj } = getCurrent();
      const effective = Math.round(tank.baseArmor * armor.multiplier);
      statsEl.innerHTML = `
        <strong>${tank.name}</strong> (${tank.country})<br>
        Base armor: ${tank.baseArmor} mm RHA<br>
        Package: ${armor.name} (×${armor.multiplier}) → <strong>${effective} mm</strong><br>
        Projectile: ${proj.name}<br>
        Pen: ${proj.penetration} mm • ${proj.type} • ${proj.velocity} m/s<br>
        <em style="color:#8899aa">${proj.note}</em>
      `;
      resultEl.className = 'result idle';
      resultEl.textContent = 'Ready';
      createProjectileVisual(proj);
    }

    tankSelect.addEventListener('change', () => {
      const tank = TANKS.find(t => t.id === tankSelect.value);
      buildTank(tank);
      updateStats();
    });
    armorSelect.addEventListener('change', updateStats);
    projSelect.addEventListener('change', updateStats);

    // ─── Fire simulation ────────────────────────────────────
    let firing = false;

    fireBtn.addEventListener('click', () => {
      if (firing) return;
      const { tank, armor, proj } = getCurrent();
      const effective = tank.baseArmor * armor.multiplier;
      // Simple model: chemical is slightly better vs ERA etc, but we keep it linear + small RNG
      let pen = proj.penetration;
      if (proj.type === 'chemical' && armor.id.includes('era') || armor.id === 'relikt') {
        pen *= 0.75; // ERA more effective vs shaped charge
      }
      if (proj.type === 'kinetic' && (armor.id === 'du' || armor.id === 'chobham')) {
        pen *= 0.9;
      }
      // APS chance to intercept missiles/drones
      let intercepted = false;
      if ((armor.id === 'trophy' || armor.id === 'iron_fist') &&
          (proj.id.includes('javelin') || proj.id.includes('kornet') || proj.id.includes('drone') ||
           proj.id.includes('hellfire') || proj.id.includes('spike') || proj.id.includes('tow') ||
           proj.id.includes('brimstone') || proj.id.includes('maverick'))) {
        if (Math.random() < 0.72) intercepted = true;
      }

      const success = !intercepted && pen > effective * (0.92 + Math.random() * 0.12);

      firing = true;
      fireBtn.disabled = true;
      resultEl.className = 'result idle';
      resultEl.textContent = 'Inbound...';

      // Animate projectile
      const start = new THREE.Vector3(22, 6 + Math.random() * 3, (Math.random() - 0.5) * 8);
      const end = new THREE.Vector3(
        (Math.random() - 0.5) * 2.5,
        1.8 + Math.random() * 0.8,
        (Math.random() - 0.5) * 1.5
      );
      projectileMesh.position.copy(start);
      projectileMesh.visible = true;
      projectileMesh.lookAt(end);

      const duration = 900 + (1 - Math.min(proj.velocity, 1700) / 1700) * 600;
      const t0 = performance.now();

      function fly(now) {
        const t = Math.min(1, (now - t0) / duration);
        const ease = t * t * (3 - 2 * t);
        projectileMesh.position.lerpVectors(start, end, ease);
        // slight drop
        projectileMesh.position.y -= Math.sin(t * Math.PI) * 0.8 * (1 - proj.velocity / 2000);

        if (t < 1) {
          requestAnimationFrame(fly);
        } else {
          projectileMesh.visible = false;
          spawnImpact(end, success && !intercepted);

          if (intercepted) {
            resultEl.className = 'result nope';
            resultEl.textContent = 'INTERCEPTED by APS';
          } else if (success) {
            resultEl.className = 'result pen';
            resultEl.textContent = 'PENETRATION — Armor defeated';
            // slight turret kick
            if (turretGroup) {
              turretGroup.rotation.z = (Math.random() - 0.5) * 0.08;
              setTimeout(() => { if (turretGroup) turretGroup.rotation.z = 0; }, 400);
            }
          } else {
            resultEl.className = 'result nope';
            resultEl.textContent = 'DEFEATED — No penetration';
          }
          firing = false;
          fireBtn.disabled = false;
        }
      }
      requestAnimationFrame(fly);
    });

    // ─── Init ───────────────────────────────────────────────
    buildTank(TANKS[0]); // M1 Abrams default
    updateStats();

    // Hide loader
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
    }, 600);

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Particles
      for (let i = impactParticles.length - 1; i >= 0; i--) {
        const p = impactParticles[i];
        p.userData.life -= 0.025;
        p.position.add(p.userData.vel);
        p.userData.vel.y -= 0.015;
        p.material.opacity = p.userData.life;
        if (p.userData.life <= 0) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          impactParticles.splice(i, 1);
        }
      }

      // Slow turret idle sway
      if (turretGroup && !firing) {
        turretGroup.rotation.y = Math.sin(performance.now() * 0.0003) * 0.04;
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
